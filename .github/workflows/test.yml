name: Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - merge/*

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Unit tests
        run: npm run jest

  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm run cypress

  # cumulocity-cypress supports Cypress >=15.10.0 <17.0.0 (peerDependencies), the job above
  # runs the tests with the locked Cypress 16. 15.21.2 is the first Cypress 15 version that
  # runs with Chrome 158 and later.
  cypress-15:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --no-audit --no-fund cypress@15.21.2
          npx cypress version

      - name: Run Cypress tests
        run: npm run cypress
