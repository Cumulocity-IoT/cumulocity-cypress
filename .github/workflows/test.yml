name: Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - merge/*
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Unit tests
        run: npm run jest

  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm run cypress

  # The cypress job tests the Cypress version from package-lock.json. This job
  # tests the older major versions within the supported peer dependency range.
  cypress-compatibility:
    name: cypress ${{ matrix.cypress }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cypress: ["13", "14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress ${{ matrix.cypress }}
        run: npm install --no-save --no-audit --no-fund cypress@${{ matrix.cypress }}

      - name: Verify Cypress version
        run: npx cypress verify && npx cypress version

      - name: Run Cypress tests
        run: npm run cypress