name: Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - merge/*

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Unit tests
        run: npm run jest

  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # the latest stable Chrome (for Testing) instead of the version of the runner image, to
      # find incompatibilities of new Chrome versions early (e.g. Chrome 158 with Cypress < 15.21.2)
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run Cypress tests
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          npx cross-env TZ=Europe/Berlin start-server-and-test start:cypress:server http://localhost:8080 \
            "cypress run --project test --browser '${{ steps.setup-chrome.outputs.chrome-path }}' --config video=false"